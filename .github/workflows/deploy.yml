name: CI / Deploy

# Every push to main builds and deploys. A pull request runs the checks and
# stops there — nothing reaches the server that has not passed them first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch; a newer push supersedes an unfinished check run.
  # The deploy job opts out of cancellation separately (see below) — half a
  # deploy is worse than a late one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CADDY_VERSION: '2.8.4'
  # Lowercase and literal: GHCR rejects an uppercase path, and
  # `github.repository_owner` is "Lehoczkil". These two strings have to
  # match compose.yaml on the server, so spelling them out keeps the pair
  # visible rather than hidden behind a case transform.
  BACKEND_IMAGE: ghcr.io/lehoczkil/evrst-demo/backend
  WEB_IMAGE: ghcr.io/lehoczkil/evrst-demo/web

jobs:
  # ── Checks ───────────────────────────────────────────────────────────────
  # Three jobs rather than three steps: they are independent, so they run in
  # parallel and a failure names itself in the UI without reading a log.

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Matches the Dockerfile's extension set — a test that passes here
          # and fails in the image is worse than no test.
          extensions: bcmath, intl, pdo_sqlite, mbstring, xml, zip, exif, pcntl, gd
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # `--no-scripts`, then create the runtime directories, then discover —
      # exactly the order the Dockerfile uses. composer's
      # post-autoload-dump hook runs `package:discover`, which boots Blade
      # and throws "Please provide a valid cache path" because
      # storage/framework/views is not tracked by git and does not exist in
      # a fresh checkout.
      - name: Install
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          mkdir -p storage/framework/cache/data storage/framework/sessions \
                   storage/framework/views storage/framework/testing \
                   storage/logs bootstrap/cache
          php artisan package:discover --ansi

      # phpunit.xml pins sqlite/:memory:, MAIL_MAILER=array and empty Discord
      # credentials, so the suite needs no services and cannot reach out.
      # APP_KEY on the command line rather than a written .env — exactly
      # what the Dockerfile does, so this job and the image agree.
      - name: Test
        working-directory: backend
        run: |
          APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')" \
            php artisan test --stop-on-failure

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile

      # eslint + stylelint + vue-tsc. `build` type-checks again, but this
      # reports a type error as a lint failure rather than a build failure.
      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Build
        working-directory: frontend
        run: bun run build

  caddy:
    name: Caddyfile
    runs-on: ubuntu-latest
    # The one file in the deploy that no test covers and that takes the whole
    # site down when it is wrong: Caddy refuses to start, and the web
    # container crash-loops with the SPA and the panel both gone.
    steps:
      - uses: actions/checkout@v5
      # `docker run caddy:2` pulled ~50 MB every run and made this the
      # slowest check in the pipeline — 76s to read one file, gating the
      # build behind it. A cached binary does the same job in about two.
      - name: Cache the caddy binary
        id: caddy-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/caddy
          key: caddy-${{ env.CADDY_VERSION }}

      - name: Install caddy
        if: steps.caddy-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin caddy
          sudo chmod +x /usr/local/bin/caddy

      - name: Validate
        env:
          SITE_ADDRESS: evrst.hu
        run: caddy validate --config deploy/Caddyfile --adapter caddyfile

  # ── Build ────────────────────────────────────────────────────────────────

  # Two jobs, not two steps: the images are independent, so they build side
  # by side instead of one after the other.
  #
  # Neither waits for the checks. They used to, and spent 76 seconds idle
  # while the slowest check finished — for a build that takes about a
  # minute. The checks still gate the DEPLOY below, so nothing unverified
  # reaches the server; the only thing that changes is that a commit whose
  # tests fail may leave an image in the registry, tagged with its own SHA
  # and referenced by nothing.
  #
  # `latest` is deliberately not pushed here. A deploy resolves IMAGE_TAG
  # from the server's .env, which this workflow rewrites to the commit SHA,
  # so nothing on the box reads `latest` — and a floating tag built from an
  # unverified commit is the one way this could bite.

  image-backend:
    name: Backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA: that is what makes a rollback one line
      # in the server's .env instead of a revert and a rebuild.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # The suite runs in its own job, in parallel with this one.
          build-args: RUN_TESTS=0
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  image-web:
    name: Web image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/web.Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── Deploy ───────────────────────────────────────────────────────────────

  deploy:
    name: Deploy to Hetzner
    needs: [backend, frontend, caddy, image-backend, image-web]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SITE_URL: https://evrst.hu
    concurrency:
      # Never cancelled: interrupting a deploy leaves the stack half
      # recreated. A second push waits for this one to finish.
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Before the agent, so a key that fails to load reports itself rather
      # than surfacing later as "Host key verification failed" from an
      # unrelated step.
      - name: Trust the host
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # `error in libcrypto` here means the secret is not a byte-for-byte
      # copy of the key file — usually a trailing newline lost to a paste.
      # `gh secret set DEPLOY_SSH_KEY < ~/.ssh/hetzner` sets it correctly.
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Over stdin, so the token never appears in the server's process list
      # or shell history. Short-lived and scoped to this run — nothing
      # long-lived is left in the box's docker config either, hence the
      # logout at the end.
      - name: Registry login on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | ssh "$HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      # `merge --ff-only`, never `reset --hard`: if the checkout has local
      # changes the deploy stops and says so, rather than discarding
      # someone's edit on a production box without a word.
      - name: Pull and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ github.sha }}
        run: |
          ssh "$HOST" "NEW_TAG='$TAG' bash -s" <<'REMOTE'
            set -euo pipefail
            cd /root/evrst-demo

            git fetch --quiet origin main
            git checkout --quiet main
            git merge --ff-only --quiet origin/main

            # Replaced, not appended, so a rollback is editing one line
            # rather than untangling a list.
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=$NEW_TAG" >> .env

            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker logout ghcr.io >/dev/null
          REMOTE

      # "The command ran" is not "the site works". The backend container is
      # healthchecked on /up, but nothing until now proved that Caddy is
      # answering on the public address with the new build behind it.
      - name: Health check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 75); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL/up" || true)
            if [ "$code" = "200" ]; then
              echo "up after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/up never returned 200 — the deploy is live but not serving"
          ssh "$HOST" 'cd /root/evrst-demo && docker compose ps && docker compose logs --tail=60 backend web'
          exit 1

      - name: Prune old images
        if: success()
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        # The volume holds the database; the image cache does not, and a
        # 38 GB disk fills quietly at two images per deploy.
        run: ssh "$HOST" 'docker image prune -af --filter "until=168h"'
