; Per-directory PHP overrides — picked up automatically by mod_php.
; Mobile photos (especially HEIC from iPhone) routinely exceed the 2 MB
; default upload_max_filesize. Keep post_max_size a bit larger so the
; surrounding form fields don't push us over the edge.
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M
